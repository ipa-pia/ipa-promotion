packages:
  - "."
overrides:
  # Keep the companion template core aligned with nuxt; both registry 0.2.10
  # releases were withdrawn after 0.2.11 became the published version.
  "@nuxt-tmpl/nuxt": "0.2.11"
  "@nuxt-tmpl/core": "0.2.11"
  "@ipa-vue/core": "0.3.13"
  "@ipa-vue/element-plus": "0.3.12"
  # The published UI package declares a monorepo-only peer that is not published
  # to the registry at all and is unused here, so drop the peer requirement.
  "@ipa-vue/element-plus>@ipa-schema/ai": "-"
  # @nuxt-tmpl/nuxt 的发布产物把依赖写成了 workspace:*（monorepo 专用协议），
  # 单独安装时 pnpm 找不到工作区包。指向 registry 上实际发布的版本。
  "@ipa-schema/api": "1.1.4"
  "@ipa-schema/logging": "1.0.0"
  "@ipa-schema/auth": "1.0.0"
allowBuilds:
  "@clerk/shared": true
  "@parcel/watcher": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - vue-router@5.1.0
  - "@nuxt-tmpl/*"
  - "@ipa-vue/*"
  - "@ipa-schema/*"
patchedDependencies:
  '@nuxt-tmpl/nuxt@0.2.11': patches/@nuxt-tmpl__nuxt@0.2.11.patch
